name: Release

# Publishing is not idempotent: a crate name and version pair can never be
# reused, and a yanked version cannot be un-yanked. So this workflow is written
# to refuse rather than to guess, and it is safe to re-run after a partial
# failure because publishing a version that is already on the registry counts as
# done rather than as an error.
#
# The checks live in ci.yaml, which this workflow calls, so "do not publish until
# everything passes" is `needs:` inside one run rather than a matter of timing.
# `workflow_run` would also make two workflows wait for one another, but it runs in
# a *second* run, from the copy of the file on the default branch, and the tag
# would have to be plumbed through by hand.

on:
  push:
    # The one and only trigger: `v<major>.<minor>.<patch>` tags. Nothing else
    # starts a run, so nothing else can reach the registry, and the shape of a
    # release tag is enforced here rather than by a script that has to remember
    # to check it.
    tags: [ "v*.*.*" ]

# Read-only by default; the publishing job asks for nothing more.
permissions:
  contents: read

jobs:
  # Everything that can be checked without credentials: formatting, clippy, the
  # test suite on three platforms, rustdoc, `cargo package`, and the MSRV build.
  # Calling the whole file means publish waits for every job in it, matrix
  # included, without listing them here.
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yaml

  # ---------------------------------------------------------------------------
  # crates.io. One package, so there is no dependency order to respect and no index
  # propagation to wait for.
  #
  # The job releases this crate with harbor itself, from the tagged commit, so the
  # release is also the most complete test the tool gets: its preflight decides
  # whether the release may start, and its publisher drives it.
  #
  # No `--order` here, and that is the interesting part: `cargo harbor publish`
  # derives what to publish from the manifests, and for a workspace of one that
  # derivation is the whole answer. The flag exists for workspaces where it is not —
  # see the README — but needing it here would mean this crate's own manifest was
  # saying something the release had to work around.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to crates.io
    needs: [ checks ]
    runs-on: ubuntu-latest
    # No `if:` needed: a tag push is the only way in, so reaching this job at all
    # means a release was asked for, and `needs` means the checks have passed.
    #
    # No `environment:` either, on purpose. Declaring one moves the secret into
    # environment scope and requires that environment to exist before the first
    # run, for a gate this project does not need yet; the token is read from
    # Settings -> Secrets and variables -> Actions instead. To add a manual
    # approval gate later, create the environment, add `environment: <name>`
    # back and move the secret into it.
    permissions:
      contents: read
    env:
      # Named once, so every step below means the same thing by "the workspace".
      HARBOR_ROOT: ${{ github.workspace }}
      # `cargo install` builds into its own temporary target directory by default, which
      # would recompile the whole dependency tree from scratch. Pointing it at the
      # workspace's target directory lets it start from what `cargo` has already built.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # Installed from the tagged commit rather than from crates.io: the point is for this
      # release to be checked and driven by *this* revision of harbor, and a published
      # version would be the previous release, which is the opposite of useful here.
      #
      # `cargo install` puts the binary on `PATH`, which is the whole reason for doing it
      # this way: `cargo-harbor` is only reachable as `cargo harbor` when cargo can find it,
      # so every step below reads as the command a person would type. Building it with
      # `cargo build` and calling `./target/release/cargo-harbor` works too, and was what
      # this job used to do, but it means the workflow documents an invocation that users
      # never perform -- and it hides the fact that the subcommand plumbing is what makes
      # `cargo harbor` work at all.
      #
      # No `rust-cache` in this job on purpose. Restoring the test job's cache is what made
      # the reference workflow report cleanup errors about a `target/package/` tree this job
      # never created.
      - name: Install the release tool from this commit
        run: cargo install --path . --locked --bin cargo-harbor

      # The preflight the release depends on, run by harbor itself. Three things in
      # one command: the tag names the version in the manifest, a registry token is
      # present, and the plan is computable at all -- the last of which is the only
      # thing that catches a dependency cycle or a members pattern that matches
      # nothing, both of which would otherwise surface half way through a release.
      #
      # The token is passed through the environment and never as an argument, so it
      # cannot reach a log by way of cargo echoing a command line. The tag is quoted
      # for the same reason it is passed at all: `GITHUB_REF_NAME` comes from the
      # event, and a tag is not the place to find out what happens without quotes.
      - name: Check the release before starting it
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo harbor --root "$HARBOR_ROOT" check --plan "$GITHUB_REF_NAME"

      # Publishing is harbor's own job, and it does it here for itself.
      #
      # What it replaces is the shell this step used to be: the retry on a registry
      # index that has not caught up, treating an already-uploaded version as done so a
      # re-run after a partial release finishes the job, and stopping at once on
      # anything else rather than spending the retry budget on a failure a retry cannot
      # fix.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo harbor --root "$HARBOR_ROOT" publish

  # ---------------------------------------------------------------------------
  # The release archive and its checksum -- see assets.yaml, which owns that pipeline.
  #
  # Called from here rather than triggered by its own `on: push: tags`, so it cannot run
  # before `checks` has passed: "an artifact never lands on a tag whose checks failed" is
  # then structural, not a matter of which workflow happened to start first.
  #
  # It does **not** wait for the crates.io publish. The archive is built from this tag's
  # source, and nothing in the download path goes through the registry -- the repositories
  # that use harbor as their release tool install it from this archive, so a slow index or a
  # registry outage would otherwise delay (or stop) a release that has nothing to do with
  # either.
  #
  # Note the difference from `publish` above: that job installs the tool from *this commit*
  # on purpose, so the release is driven by the revision being released. This job builds the
  # same revision for other machines to install later.
  # ---------------------------------------------------------------------------
  assets:
    name: Archive
    needs: [ checks ]
    uses: ./.github/workflows/assets.yaml
    permissions:
      # The called workflow can only narrow this; it needs to write to the release.
      contents: write

